<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de chamado</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="pagina">
    <section class="painel">
      <p class="rotulo">Laboratório Full Stack</p>
      <h1>Abertura de chamado</h1>
      <p>Preencha o formulário para enviar uma requisição à API.</p>

      <form id="formulario" novalidate>
        <label for="aluno">Nome do aluno</label>
        <input id="aluno" name="aluno" type="text" placeholder="Ex.: Ana Souza">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="text" placeholder="ana@exemplo.com">

        <label for="assunto">Assunto</label>
        <input id="assunto" name="assunto" type="text" placeholder="Dúvida sobre a atividade">

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" placeholder="Descreva a solicitação"></textarea>

        <label for="prioridade">Prioridade</label>
        <select id="prioridade" name="prioridade">
          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>
        </select>

        <button type="submit">Enviar para a API</button>
      </form>
    </section>

    <section class="painel resposta">
      <div class="cabecalho-resposta">
        <h2>Resposta recebida</h2>
        <span id="status">Aguardando envio</span>
      </div>
      <pre id="saida">A resposta JSON aparecerá aqui.</pre>

      <div class="cabecalho-lista">
        <h2>Dados persistidos</h2>
        <button id="consultar" class="secundario" type="button">Consultar SQLite</button>
      </div>
      <div id="lista"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
